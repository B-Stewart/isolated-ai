schemaVersion: "2"
kind: sandbox
name: isoai-claude
args:
  image:
    default: local/agentic-base-sbx:experiment
sandbox:
  image: "${{ kit.args.image }}"
  entrypoint: [claude]
credentials:
  - service: anthropic
    apiKey:
      name: ANTHROPIC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.anthropic.com
          header: x-api-key
          format: "%s"
permissions:
  network:
    allow: [api.anthropic.com, github.com, api.github.com, raw.githubusercontent.com, npmjs.org, registry.npmjs.org, pypi.org, files.pythonhosted.org]
