# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: OpenCode

args:
  base_image:
    default: local/isoai-sbx-base:scaffold
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]*$'
    buildArg: BASE_IMAGE

provides: ["opencode@2.1.3"]

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - opencode.ai:443
          - models.dev:443
          - nodejs.org:443
          - registry.npmjs.org:443
          - github.com:443
          - api.github.com:443
          - release-assets.githubusercontent.com:443
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
